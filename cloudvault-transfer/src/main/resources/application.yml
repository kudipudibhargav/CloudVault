server:
  port: 8083

spring:
  application:
    name: cloudvault-transfer
  profiles:
    active: local-h2

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

resilience4j:
  circuitbreaker:
    instances:
      coreServiceCB:
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 5000
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

---
# Local In-Memory Fallback Profile
spring:
  config:
    activate:
      on-profile: local-h2
  data:
    redis:
      host: localhost
      port: 6379

cloudvault:
  jwt:
    secret: dGVzdHNlY3JldGtleWZvcmNsb3VkdmF1bHRlbnRlcnByaXNlYXV0aHNlcnZpY2V3aXRoZW5vdWdoYml0czI1Ng==
  minio:
    endpoint: http://localhost:9000
    accessKey: minioadmin
    secretKey: minioadmin
    bucketName: cloudvault-bucket

---
# PostgreSQL & Redis Profile
spring:
  config:
    activate:
      on-profile: postgres
  data:
    redis:
      host: localhost
      port: 6379

cloudvault:
  jwt:
    secret: dGVzdHNlY3JldGtleWZvcmNsb3VkdmF1bHRlbnRlcnByaXNlYXV0aHNlcnZpY2V3aXRoZW5vdWdoYml0czI1Ng==
  minio:
    endpoint: http://localhost:9000
    accessKey: minioadmin
    secretKey: minioadmin
    bucketName: cloudvault-bucket
